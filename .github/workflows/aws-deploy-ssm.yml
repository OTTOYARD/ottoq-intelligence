# aws-deploy-ssm — rebuild the intelligence service over AWS Systems Manager, and PROVE the new
# image is the one now serving. This is deploy.yml's job done without SSH.
#
# WHY IT REPLACES deploy.yml RATHER THAN SITTING BESIDE IT.
#
# deploy.yml works, and it needs three things this does not: a private key in a repository
# secret, port 22 reachable from a GitHub-hosted runner's dynamic IP, and port 8080 reachable
# from that runner too — because its final assertion curls `/health` from the OUTSIDE. Those
# three requirements are why it was never activated: `deploy/DEPLOY_EC2.md` had the operator
# restrict port 22 to "My IP", so GitHub was turned away at the door.
#
# Over SSM none of that applies. The box needs **no inbound rules at all** — the agent dials
# out to the SSM endpoints on 443 — and there is no key material anywhere in this repository.
#
# AND THE HEALTH ASSERTION GETS STRICTLY BETTER, which is the part worth noticing. deploy.yml
# asserts against `http://EC2_HOST:8080/health`, from the runner, which requires 8080 open to
# the internet. Here the same assertion runs ON the box against 127.0.0.1, so the strongest
# check in the pipeline stops depending on the weakest part of the network posture.
#
# THE ASSERTION ITSELF IS UNCHANGED AND IS THE POINT. It checks that `/health` lists the
# expected optimizer, not that it returns 200. A 200 proves the box is up and proves nothing
# about which build is on it — and that is exactly how a pre-CP-SAT image served happily for
# five days while the twin's edge function correctly refused its output as "an invalid proposer
# envelope". Commit 7923cf9 added app/optimizers/assignment_cpsat.py AND changed Dockerfile and
# requirements.txt, so the running image physically could not serve CP-SAT. Nothing was broken
# except that the image predated the feature.
#
# PREREQUISITE: the instance must be SSM-managed. `aws-activate-ssm.yml` does that, and
# confirmed it on 2026-09-21 — i-01500ed2fddc67c66 reported Online in 20s, Ubuntu 24.04, agent
# 3.3.4793.0. If SSM cannot reach the box this workflow fails immediately and says so, rather
# than timing out somewhere useful-looking.

name: aws-deploy-ssm

on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: "EC2 instance id (must be Name=ottoq-intel-2)"
        required: true
      expect_optimizer:
        description: "Optimizer name that /health must list after the deploy"
        required: false
        default: "cp_sat_forward_lex"
      git_ref:
        description: "Git ref to deploy on the box"
        required: false
        default: "main"
      discover_only:
        description: "Report what is on the box and stop -- changes nothing"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

concurrency:
  # Two concurrent deploys would race on the container name. Never cancel in progress: a
  # half-replaced container is worse than a queued deploy. Same reasoning as deploy.yml.
  group: deploy-intelligence
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: us-east-1
  IID: ${{ inputs.instance_id }}
  EXPECT: ${{ inputs.expect_optimizer }}
  GITREF: ${{ inputs.git_ref }}
  EXPECT_NAME: ottoq-intel-2
  DISCOVER_ONLY: ${{ inputs.discover_only }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Check out the ref being deployed
        # NEW: the box has no git checkout (run 4's discovery), so the SOURCE has to come from
        # here. Previously this workflow ran `git fetch && reset --hard` on the box, which could
        # never have worked: /opt/ottoq holds the full tree but no .git anywhere on the host.
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
          fetch-depth: 1

      - name: Guard — the target must be the intelligence box, and SSM must already reach it
        run: |
          set -euo pipefail
          acct="$(aws sts get-caller-identity --query Account --output text)"
          echo "::add-mask::${acct}"

          # Same name guard as aws-activate-ssm. A deploy is less dangerous than a start, but
          # running a docker build on the wrong box is still not something to do by typo.
          name="$(aws ec2 describe-instances --instance-ids "${IID}" \
                   --query 'Reservations[0].Instances[0].join(`,`,Tags[?Key==`Name`].Value)' --output text)"
          if [ "${name}" != "${EXPECT_NAME}" ]; then
            echo "::error::REFUSING: Name tag is '${name}', expected '${EXPECT_NAME}'."
            exit 1
          fi

          ping="$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=${IID}" \
                   --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || true)"
          if [ "${ping}" != "Online" ]; then
            echo "::error::SSM reports PingStatus '${ping}' for ${IID}, not Online."
            echo "Run aws-activate-ssm.yml first: it attaches the instance profile and starts the box."
            echo "Failing here rather than sending a command that would sit queued until it expired."
            exit 1
          fi
          echo "guards passed; SSM is Online for ${IID}"

      - name: Send the rebuild, and wait for it
        id: send
        run: |
          set -euo pipefail
          # WHY THE SCRIPT IS SENT BASE64-ENCODED, and this is a fix rather than a flourish.
          #
          # Run 1 of this workflow failed in 13 seconds with the box's own stderr saying:
          #   _script.sh: 1: set: Illegal option -o pipefail
          # AWS-RunShellScript writes the `commands` array to a file and runs it with **/bin/sh**,
          # which on Ubuntu is dash. `set -o pipefail` is a bash-ism, so line 1 aborted and nothing
          # else ran. Nothing on the box was touched, because the script never reached a docker call.
          #
          # Dropping pipefail would have been the one-character fix and the wrong one. The script
          # below carries a docker --format string full of `{{...}}`, nested single and double
          # quotes, and `$(...)` — every one of which is a quoting hazard when it has to survive
          # being embedded in a JSON array element AND re-parsed by a shell. So the script is
          # written here as ordinary bash, encoded once, and the only thing sh ever sees is a
          # single decode-and-run line. That removes the entire class of failure rather than this
          # one instance of it, and it means the script running on the box is byte-identical to the
          # script written here.
          # Build the payload the box will extract. --exclude __pycache__: stale .pyc compiled
          # against the old tree is exactly what makes a deploy look applied and behave otherwise.
          # --sort=name and a fixed mtime so the same ref produces the same bytes, which makes the
          # digest below a meaningful identity rather than a per-run nonce.
          tar czf /tmp/ottoq_src.tgz --exclude='__pycache__' --sort=name \
              --mtime='@0' --owner=0 --group=0 --numeric-owner \
              app Dockerfile requirements.txt
          SRC_SHA="$(sha256sum /tmp/ottoq_src.tgz | cut -d' ' -f1)"
          GITSHA="$(git rev-parse HEAD)"
          echo "shipping $(wc -c < /tmp/ottoq_src.tgz) bytes, sha256 ${SRC_SHA}, commit ${GITSHA}"

          cat > /tmp/ottoq_deploy.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          export HOME=/root

          # ── DISCOVERY FIRST, and it exists because of how run 3 failed. ──
          # Run 3's breadcrumbs read: BEGIN / WROTE_B64 2512 / DECODED 1882 / /usr/bin/bash, then
          # SILENCE and exit 2. The script died before its own first echo, and the cause was mine:
          # `ls -d <nonexistent>` exits 2, and with `set -e` plus `pipefail` that killed the script
          # BEFORE the `if` written to report it. The guard I added to make failures loud is what
          # made this one invisible. Two lessons, both encoded below:
          #   - a command substitution whose failure you intend to HANDLE needs `|| true` inside it,
          #     or pipefail hands it to set -e first;
          #   - and I was guessing the checkout path. So now the box is asked rather than assumed,
          #     and it reports unconditionally, before anything can fail.
          echo "--- discovery ---"
          echo "whoami: $(whoami 2>/dev/null || true)  home: ${HOME:-unset}"
          echo "candidate dirs:"
          for d in /home/* /root /opt /srv /var/www; do
            [ -d "$d" ] && echo "  $d: $(ls -A "$d" 2>/dev/null | head -8 | tr '\n' ' ')"
          done
          echo "git checkouts found anywhere shallow:"
          find / -maxdepth 4 -type d -name '.git' 2>/dev/null | head -10 | sed 's|/.git$||' | sed 's/^/  /' || true
          echo "docker ps:"
          docker ps --format '  {{.Names}}  {{.Image}}  {{.Status}}  {{.Ports}}' 2>/dev/null || echo "  (docker ps failed)"
          echo "docker images:"
          docker images --format '  {{.Repository}}:{{.Tag}}  {{.CreatedSince}}' 2>/dev/null | head -8 || true
          echo "local /health right now:"
          curl -fsS --max-time 5 http://127.0.0.1:8080/health 2>/dev/null | sed 's/^/  /' || echo "  (no answer on 8080)"
          echo "/opt/ottoq tree (2 levels):"
          find /opt/ottoq -maxdepth 2 2>/dev/null | head -40 | sed 's/^/  /' || echo "  (absent)"
          echo "Dockerfile / requirements anywhere shallow:"
          find / -maxdepth 5 \( -name Dockerfile -o -name requirements.txt \) 2>/dev/null | head -10 | sed 's/^/  /' || true
          echo "how the container was started:"
          docker inspect ottoq-intel --format '  image={{.Config.Image}} created={{.Created}} cmd={{json .Config.Cmd}}' 2>/dev/null || true
          docker inspect ottoq-intel --format '  mounts={{json .Mounts}}' 2>/dev/null || true
          echo "--- end discovery ---"
          if [ "__DISCOVER_ONLY__" = "true" ]; then
            echo "DISCOVER_ONLY: stopping here. Nothing was changed."
            exit 0
          fi

          # ── FIND THE TREE BY WHAT IT CONTAINS, NOT BY WHAT IT IS CALLED. ──
          # Run 6 shipped the source perfectly (DECODED_SRC 23085 bytes, byte-exact) and then still
          # said "no checkout found", because this locator searched for a directory NAMED
          # `ottoq-intelligence` and the one on the box is **/opt/ottoq**. The discovery block had
          # printed that path, and I had written it into the commit message and the PR body, and
          # still left the search looking for the other name. Identify a thing by what it IS.
          #
          # The signature is a Dockerfile beside app/main.py — the two files this deploy actually
          # needs. A directory that has both is the tree we build, whatever it is called; one that
          # lacks either is not, however promising its name.
          CHECKOUT=""
          for d in /opt/ottoq /opt/ottoq-intelligence /srv/ottoq /srv/ottoq-intelligence \
                   /root/ottoq /root/ottoq-intelligence /home/*/ottoq /home/*/ottoq-intelligence; do
            if [ -f "${d}/Dockerfile" ] && [ -f "${d}/app/main.py" ]; then CHECKOUT="${d}"; break; fi
          done
          if [ -z "${CHECKOUT:-}" ]; then
            # `|| true` INSIDE the substitution: without it pipefail hands find's exit status to
            # set -e and the script dies before reporting anything, which is how run 3 failed.
            CHECKOUT="$(find / -maxdepth 6 -path '*/app/main.py' 2>/dev/null | head -1 \
                        | sed 's|/app/main.py$||' || true)"
            [ -n "${CHECKOUT:-}" ] && [ ! -f "${CHECKOUT}/Dockerfile" ] && CHECKOUT=""
          fi
          if [ -z "${CHECKOUT:-}" ]; then
            echo "FATAL: no directory on this box holds both a Dockerfile and app/main.py."
            echo "The discovery block above says what IS here. Read that rather than re-running:"
            echo "if the service was deployed from an image built elsewhere, there is no tree to"
            echo "update in place and this workflow is the wrong shape for that box."
            exit 1
          fi
          echo "checkout: ${CHECKOUT} (identified by Dockerfile + app/main.py)"
          cd "${CHECKOUT}"

          # ── THE SOURCE ARRIVES AS A TARBALL, because this box has no git. ──
          # Run 4's discovery: /opt/ottoq holds the full tree (app/, Dockerfile, requirements.txt,
          # tests/) but there is NO .git anywhere on the host, so the `git fetch && reset --hard`
          # this block used to contain could never have worked. The July image was built from that
          # tree and the tree never moved again.
          #
          # The whole clean tree ships rather than a hand-picked delta. It is 23 KB gzipped, 32 KB
          # base64 — well inside SSM's parameter budget — and shipping all of it removes the risk
          # of omitting a file CP-SAT needs. __pycache__ is excluded: stale .pyc files compiled
          # against the old tree are exactly the kind of thing that makes a deploy look applied
          # and behave otherwise.
          if [ ! -f /tmp/ottoq_src.tgz ]; then
            echo "FATAL: /tmp/ottoq_src.tgz was not delivered. Nothing has been changed."
            exit 1
          fi
          got="$(sha256sum /tmp/ottoq_src.tgz | cut -d" " -f1)"
          if [ "${got}" != "__SRC_SHA__" ]; then
            echo "FATAL: shipped tarball digest mismatch."
            echo "  expected __SRC_SHA__"
            echo "  got      ${got}"
            echo "The transfer was truncated or corrupted. NOTHING has been extracted -- the"
            echo "running container is untouched. Re-run; do not extract a partial tree."
            exit 1
          fi
          echo "tarball digest verified: ${got}"

          # A backup, because the temporary image tag protects the RUNNING container but not the
          # ability to rebuild the previous one. Timestamped so repeated deploys do not overwrite
          # the only copy of a known-good tree.
          BACKUP="/opt/ottoq_backup_$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p "${BACKUP}"
          cp -a app Dockerfile requirements.txt "${BACKUP}/" 2>/dev/null || true
          echo "previous tree backed up to ${BACKUP}"

          tar xzf /tmp/ottoq_src.tgz -C "${CHECKOUT}"
          echo "extracted __GITREF__ (__SRC_SHA_SHORT__) into ${CHECKOUT}"

          # THE BOX HAD NO WAY TO SAY WHICH COMMIT IT WAS RUNNING, and that is precisely how a
          # pre-CP-SAT image served for five days unnoticed. It does now.
          printf '%s\n' "__GITSHA__" > "${CHECKOUT}/.deployed_sha"
          printf '%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ) __GITREF__ __GITSHA__" >> "${CHECKOUT}/.deploy_history"
          echo "recorded deployed sha: __GITSHA__"

          # Carry the running container's token forward rather than requiring it as a secret here.
          # The service answers 503 to everything when OTTOQ_API_TOKEN is unset, so losing it on a
          # rebuild would take the service down in a way that looks like a network fault.
          TOKEN="$(docker inspect ottoq-intel --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | sed -n 's/^OTTOQ_API_TOKEN=//p' | head -1 || true)"
          if [ -z "${TOKEN:-}" ]; then
            echo "FATAL: could not read OTTOQ_API_TOKEN from the running container."
            echo "Refusing to redeploy without it -- a tokenless service answers 503 to everything."
            exit 1
          fi

          # Temporary tag, so a build failure leaves the CURRENT container running and serving.
          docker build -t ottoq-intel:new .

          docker rm -f ottoq-intel 2>/dev/null || true
          docker tag ottoq-intel:new ottoq-intel:latest
          docker run -d --restart unless-stopped -p 8080:8080 \
            -e OTTOQ_API_TOKEN="${TOKEN}" \
            --name ottoq-intel ottoq-intel:latest

          for i in $(seq 1 45); do
            curl -fsS --max-time 3 http://127.0.0.1:8080/health >/dev/null 2>&1 && break
            sleep 2
          done

          BODY="$(curl -fsS --max-time 10 http://127.0.0.1:8080/health)"
          echo "HEALTH: ${BODY}"
          if ! printf '%s' "${BODY}" | grep -q -- '__EXPECT__'; then
            echo "FATAL: /health does not list __EXPECT__. The running image is not the build just deployed."
            exit 1
          fi
          echo "VERIFIED: /health lists __EXPECT__"
          docker image prune -f >/dev/null 2>&1 || true
          SH
          sed -i "s|__GITREF__|${GITREF}|g; s|__EXPECT__|${EXPECT}|g; s|__DISCOVER_ONLY__|${DISCOVER_ONLY}|g; s|__SRC_SHA__|${SRC_SHA}|g; s|__SRC_SHA_SHORT__|${SRC_SHA:0:12}|g; s|__GITSHA__|${GITSHA}|g" /tmp/ottoq_deploy.sh
          for ph in __GITREF__ __EXPECT__ __DISCOVER_ONLY__ __SRC_SHA__ __GITSHA__; do
            if grep -q -- "${ph}" /tmp/ottoq_deploy.sh; then
              echo "::error::placeholder ${ph} was not substituted; refusing to send."
              exit 1
            fi
          done
          bash -n /tmp/ottoq_deploy.sh && echo "script parses as bash"

          # RUN 2 FAILED WITH NO OUTPUT AT ALL -- stderr was just "failed to run commands: exit
          # status 2" and stdout was empty. That is worse than run 1's failure, which at least
          # named its cause: a single decode-and-run line gives the box nowhere to report from, so
          # I could not tell whether base64 or bash had failed. **Fixing the diagnostic is the
          # first job here, not the deploy.**
          #
          # So the payload is now a LIST of sh-safe lines, each leaving a breadcrumb on stdout, and
          # the base64 is written in chunks with printf rather than one enormous echo argument.
          # Whatever fails next, the breadcrumbs say how far it got: BEGIN, WROTE_B64 with a byte
          # count, DECODED with a byte count, then the script's own output. Base64's alphabet has
          # no single quotes, so single-quoting each chunk is safe by construction.
          python3 - > /tmp/params.json <<'PY'
          import base64, json, os, textwrap

          def chunked(path, dest, label):
              """Emit sh-safe lines that rebuild `path` at `dest` on the box.

              Base64's alphabet holds no single quotes, so single-quoting each chunk is safe by
              construction rather than by luck. printf rather than echo: dash's echo interprets
              backslashes and a 32 KB single argument is not worth the doubt.
              """
              b64 = base64.b64encode(open(path, 'rb').read()).decode()
              out = ["rm -f %s.b64" % dest]
              for c in textwrap.wrap(b64, 700):
                  out.append("printf '%s' '" + c + "' >> " + dest + ".b64")
              out.append('echo "WROTE_%s $(wc -c < %s.b64) bytes"' % (label, dest))
              out.append("base64 -d %s.b64 > %s" % (dest, dest))
              out.append('echo "DECODED_%s $(wc -c < %s) bytes"' % (label, dest))
              return out

          cmds = ["echo BEGIN"]
          # The SOURCE first: if it is truncated the script refuses to extract, and refusing
          # before touching anything is worth more than failing halfway through.
          cmds += chunked('/tmp/ottoq_src.tgz', '/tmp/ottoq_src.tgz', 'SRC')
          cmds += chunked('/tmp/ottoq_deploy.sh', '/tmp/ottoq_deploy.sh', 'SCRIPT')
          cmds += ["command -v bash || echo NO_BASH_ON_PATH", "bash /tmp/ottoq_deploy.sh"]
          print(json.dumps({"commands": cmds}))
          PY
          echo "payload: $(python3 -c "import json;print(len(json.load(open('/tmp/params.json'))['commands']),'commands')")"

          cid="$(aws ssm send-command \
                  --instance-ids "${IID}" \
                  --document-name AWS-RunShellScript \
                  --comment "ottoq-intelligence rebuild via aws-deploy-ssm" \
                  --timeout-seconds 600 \
                  --cloud-watch-output-config CloudWatchOutputEnabled=false \
                  --parameters file:///tmp/params.json \
                  --query 'Command.CommandId' --output text)"
          echo "command id: ${cid}"
          echo "cid=${cid}" >> "$GITHUB_OUTPUT"

          # Poll rather than `aws ssm wait`, so status is visible while it runs: a docker build
          # takes minutes and a silent wait is indistinguishable from a hang.
          #
          # THE BUDGET, corrected after run 7. `--timeout-seconds` above is SSM's DELIVERY timeout
          # — how long it waits for the agent to pick the command up — not the execution timeout,
          # which for AWS-RunShellScript defaults to an hour. I had set delivery to 1200 believing
          # it bounded the build, and polled for only 1500s. Run 7's OR-Tools build on a t3.medium
          # was still going at 24 minutes, so the loop would have exhausted while the command was
          # legitimately running and the next step would have called it FAILED. **A timeout of my
          # patience is not a build failure**, and reporting it as one is the same class of defect
          # as a success line that proves nothing. Delivery is now 600s (if the agent has not taken
          # it in ten minutes, something is wrong with the agent) and the poll budget is 55 minutes,
          # inside the job's 70-minute ceiling.
          st=Pending
          for i in $(seq 1 330); do
            st="$(aws ssm get-command-invocation --command-id "${cid}" --instance-id "${IID}" \
                   --query Status --output text 2>/dev/null || echo Pending)"
            case "${st}" in
              Success|Failed|Cancelled|TimedOut) echo "status: ${st}"; break ;;
              *) echo "  ... ${st} ($((i*10))s)"; sleep 10 ;;
            esac
          done
          echo "final_status=${st}" >> "$GITHUB_OUTPUT"

      - name: Print what the box said, whatever happened
        if: always()
        run: |
          set -uo pipefail
          cid="${{ steps.send.outputs.cid }}"
          [ -z "${cid}" ] && { echo "no command was sent"; exit 0; }
          echo "=== stdout ==="
          aws ssm get-command-invocation --command-id "${cid}" --instance-id "${IID}" \
            --query StandardOutputContent --output text 2>/dev/null || true
          echo
          echo "=== stderr ==="
          aws ssm get-command-invocation --command-id "${cid}" --instance-id "${IID}" \
            --query StandardErrorContent --output text 2>/dev/null || true

      - name: Fail the workflow if the box failed
        run: |
          st="${{ steps.send.outputs.final_status }}"
          cid="${{ steps.send.outputs.cid }}"
          case "${st}" in
            Success) : ;;
            InProgress|Pending|Delayed)
              # Run 7 is why this branch exists. The command had not finished when the poll budget
              # ran out; calling that a failure would blame the box for my impatience, and would
              # also hide the fact that the build may still be about to succeed.
              echo "::warning::the rebuild is STILL RUNNING on the box (status: ${st})."
              echo "This workflow stopped waiting; it did not fail. The command is unaffected."
              echo "Check it with:  aws ssm get-command-invocation --command-id ${cid} --instance-id ${IID}"
              echo "or re-run this workflow once it has finished -- every step is idempotent, and the"
              echo "digest check refuses to extract a tree that is already identical in content."
              exit 1 ;;
            *)
              echo "::error::the rebuild did not succeed on the box (status: ${st})."
              echo "The stdout/stderr above is from the box itself -- read that, not this line."
              exit 1 ;;
          esac
          # DISCOVER_ONLY exits 0 without ever reaching the health assertion, and run 5 printed
          # "rebuild succeeded and /health lists cp_sat_forward_lex" anyway -- a success line
          # claiming a check that had been skipped. That is precisely the defect this workflow
          # exists to catch in the service (a 200 that proves nothing), committed by the workflow
          # itself. So the claim is now conditional on having actually made it.
          if [ "${DISCOVER_ONLY}" = "true" ]; then
            echo "discovery completed. NOTHING was deployed and NO health assertion was made."
          else
            echo "rebuild succeeded and /health lists ${EXPECT}"
          fi
