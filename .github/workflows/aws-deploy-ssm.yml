# aws-deploy-ssm — rebuild the intelligence service over AWS Systems Manager, and PROVE the new
# image is the one now serving. This is deploy.yml's job done without SSH.
#
# WHY IT REPLACES deploy.yml RATHER THAN SITTING BESIDE IT.
#
# deploy.yml works, and it needs three things this does not: a private key in a repository
# secret, port 22 reachable from a GitHub-hosted runner's dynamic IP, and port 8080 reachable
# from that runner too — because its final assertion curls `/health` from the OUTSIDE. Those
# three requirements are why it was never activated: `deploy/DEPLOY_EC2.md` had the operator
# restrict port 22 to "My IP", so GitHub was turned away at the door.
#
# Over SSM none of that applies. The box needs **no inbound rules at all** — the agent dials
# out to the SSM endpoints on 443 — and there is no key material anywhere in this repository.
#
# AND THE HEALTH ASSERTION GETS STRICTLY BETTER, which is the part worth noticing. deploy.yml
# asserts against `http://EC2_HOST:8080/health`, from the runner, which requires 8080 open to
# the internet. Here the same assertion runs ON the box against 127.0.0.1, so the strongest
# check in the pipeline stops depending on the weakest part of the network posture.
#
# THE ASSERTION ITSELF IS UNCHANGED AND IS THE POINT. It checks that `/health` lists the
# expected optimizer, not that it returns 200. A 200 proves the box is up and proves nothing
# about which build is on it — and that is exactly how a pre-CP-SAT image served happily for
# five days while the twin's edge function correctly refused its output as "an invalid proposer
# envelope". Commit 7923cf9 added app/optimizers/assignment_cpsat.py AND changed Dockerfile and
# requirements.txt, so the running image physically could not serve CP-SAT. Nothing was broken
# except that the image predated the feature.
#
# PREREQUISITE: the instance must be SSM-managed. `aws-activate-ssm.yml` does that, and
# confirmed it on 2026-09-21 — i-01500ed2fddc67c66 reported Online in 20s, Ubuntu 24.04, agent
# 3.3.4793.0. If SSM cannot reach the box this workflow fails immediately and says so, rather
# than timing out somewhere useful-looking.

name: aws-deploy-ssm

on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: "EC2 instance id (must be Name=ottoq-intel-2)"
        required: true
      expect_optimizer:
        description: "Optimizer name that /health must list after the deploy"
        required: false
        default: "cp_sat_forward_lex"
      git_ref:
        description: "Git ref to deploy on the box"
        required: false
        default: "main"

concurrency:
  # Two concurrent deploys would race on the container name. Never cancel in progress: a
  # half-replaced container is worse than a queued deploy. Same reasoning as deploy.yml.
  group: deploy-intelligence
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: us-east-1
  IID: ${{ inputs.instance_id }}
  EXPECT: ${{ inputs.expect_optimizer }}
  GITREF: ${{ inputs.git_ref }}
  EXPECT_NAME: ottoq-intel-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Guard — the target must be the intelligence box, and SSM must already reach it
        run: |
          set -euo pipefail
          acct="$(aws sts get-caller-identity --query Account --output text)"
          echo "::add-mask::${acct}"

          # Same name guard as aws-activate-ssm. A deploy is less dangerous than a start, but
          # running a docker build on the wrong box is still not something to do by typo.
          name="$(aws ec2 describe-instances --instance-ids "${IID}" \
                   --query 'Reservations[0].Instances[0].join(`,`,Tags[?Key==`Name`].Value)' --output text)"
          if [ "${name}" != "${EXPECT_NAME}" ]; then
            echo "::error::REFUSING: Name tag is '${name}', expected '${EXPECT_NAME}'."
            exit 1
          fi

          ping="$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=${IID}" \
                   --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || true)"
          if [ "${ping}" != "Online" ]; then
            echo "::error::SSM reports PingStatus '${ping}' for ${IID}, not Online."
            echo "Run aws-activate-ssm.yml first: it attaches the instance profile and starts the box."
            echo "Failing here rather than sending a command that would sit queued until it expired."
            exit 1
          fi
          echo "guards passed; SSM is Online for ${IID}"

      - name: Send the rebuild, and wait for it
        id: send
        run: |
          set -euo pipefail
          # WHY THE SCRIPT IS SENT BASE64-ENCODED, and this is a fix rather than a flourish.
          #
          # Run 1 of this workflow failed in 13 seconds with the box's own stderr saying:
          #   _script.sh: 1: set: Illegal option -o pipefail
          # AWS-RunShellScript writes the `commands` array to a file and runs it with **/bin/sh**,
          # which on Ubuntu is dash. `set -o pipefail` is a bash-ism, so line 1 aborted and nothing
          # else ran. Nothing on the box was touched, because the script never reached a docker call.
          #
          # Dropping pipefail would have been the one-character fix and the wrong one. The script
          # below carries a docker --format string full of `{{...}}`, nested single and double
          # quotes, and `$(...)` — every one of which is a quoting hazard when it has to survive
          # being embedded in a JSON array element AND re-parsed by a shell. So the script is
          # written here as ordinary bash, encoded once, and the only thing sh ever sees is a
          # single decode-and-run line. That removes the entire class of failure rather than this
          # one instance of it, and it means the script running on the box is byte-identical to the
          # script written here.
          cat > /tmp/ottoq_deploy.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          export HOME=/root

          # ── DISCOVERY FIRST, and it exists because of how run 3 failed. ──
          # Run 3's breadcrumbs read: BEGIN / WROTE_B64 2512 / DECODED 1882 / /usr/bin/bash, then
          # SILENCE and exit 2. The script died before its own first echo, and the cause was mine:
          # `ls -d <nonexistent>` exits 2, and with `set -e` plus `pipefail` that killed the script
          # BEFORE the `if` written to report it. The guard I added to make failures loud is what
          # made this one invisible. Two lessons, both encoded below:
          #   - a command substitution whose failure you intend to HANDLE needs `|| true` inside it,
          #     or pipefail hands it to set -e first;
          #   - and I was guessing the checkout path. So now the box is asked rather than assumed,
          #     and it reports unconditionally, before anything can fail.
          echo "--- discovery ---"
          echo "whoami: $(whoami 2>/dev/null || true)  home: ${HOME:-unset}"
          echo "candidate dirs:"
          for d in /home/* /root /opt /srv /var/www; do
            [ -d "$d" ] && echo "  $d: $(ls -A "$d" 2>/dev/null | head -8 | tr '\n' ' ')"
          done
          echo "git checkouts found anywhere shallow:"
          find / -maxdepth 4 -type d -name '.git' 2>/dev/null | head -10 | sed 's|/.git$||' | sed 's/^/  /' || true
          echo "docker ps:"
          docker ps --format '  {{.Names}}  {{.Image}}  {{.Status}}  {{.Ports}}' 2>/dev/null || echo "  (docker ps failed)"
          echo "docker images:"
          docker images --format '  {{.Repository}}:{{.Tag}}  {{.CreatedSince}}' 2>/dev/null | head -8 || true
          echo "local /health right now:"
          curl -fsS --max-time 5 http://127.0.0.1:8080/health 2>/dev/null | sed 's/^/  /' || echo "  (no answer on 8080)"
          echo "--- end discovery ---"

          # `|| true` INSIDE the substitution: see the comment above. Without it pipefail hands
          # ls's exit 2 to set -e and the script dies before reporting anything at all.
          CHECKOUT="$(ls -d /home/*/ottoq-intelligence /root/ottoq-intelligence /opt/ottoq-intelligence /srv/ottoq-intelligence 2>/dev/null | head -1 || true)"
          if [ -z "${CHECKOUT:-}" ]; then
            CHECKOUT="$(find / -maxdepth 5 -type d -name 'ottoq-intelligence' 2>/dev/null | head -1 || true)"
          fi
          if [ -z "${CHECKOUT:-}" ]; then
            echo "FATAL: no ottoq-intelligence checkout found on this box."
            echo "The discovery block above says what IS here. Read that rather than re-running:"
            echo "if the service was deployed from an image built elsewhere, there is no checkout to"
            echo "pull and this workflow is the wrong shape for that box."
            exit 1
          fi
          echo "checkout: ${CHECKOUT}"
          cd "${CHECKOUT}"

          git fetch --prune origin
          git checkout "__GITREF__"
          git reset --hard "origin/__GITREF__"
          echo "deploying $(git rev-parse --short HEAD)"

          # Carry the running container's token forward rather than requiring it as a secret here.
          # The service answers 503 to everything when OTTOQ_API_TOKEN is unset, so losing it on a
          # rebuild would take the service down in a way that looks like a network fault.
          TOKEN="$(docker inspect ottoq-intel --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | sed -n 's/^OTTOQ_API_TOKEN=//p' | head -1 || true)"
          if [ -z "${TOKEN:-}" ]; then
            echo "FATAL: could not read OTTOQ_API_TOKEN from the running container."
            echo "Refusing to redeploy without it -- a tokenless service answers 503 to everything."
            exit 1
          fi

          # Temporary tag, so a build failure leaves the CURRENT container running and serving.
          docker build -t ottoq-intel:new .

          docker rm -f ottoq-intel 2>/dev/null || true
          docker tag ottoq-intel:new ottoq-intel:latest
          docker run -d --restart unless-stopped -p 8080:8080 \
            -e OTTOQ_API_TOKEN="${TOKEN}" \
            --name ottoq-intel ottoq-intel:latest

          for i in $(seq 1 45); do
            curl -fsS --max-time 3 http://127.0.0.1:8080/health >/dev/null 2>&1 && break
            sleep 2
          done

          BODY="$(curl -fsS --max-time 10 http://127.0.0.1:8080/health)"
          echo "HEALTH: ${BODY}"
          if ! printf '%s' "${BODY}" | grep -q -- '__EXPECT__'; then
            echo "FATAL: /health does not list __EXPECT__. The running image is not the build just deployed."
            exit 1
          fi
          echo "VERIFIED: /health lists __EXPECT__"
          docker image prune -f >/dev/null 2>&1 || true
          SH
          sed -i "s|__GITREF__|${GITREF}|g; s|__EXPECT__|${EXPECT}|g" /tmp/ottoq_deploy.sh
          bash -n /tmp/ottoq_deploy.sh && echo "script parses as bash"

          # RUN 2 FAILED WITH NO OUTPUT AT ALL -- stderr was just "failed to run commands: exit
          # status 2" and stdout was empty. That is worse than run 1's failure, which at least
          # named its cause: a single decode-and-run line gives the box nowhere to report from, so
          # I could not tell whether base64 or bash had failed. **Fixing the diagnostic is the
          # first job here, not the deploy.**
          #
          # So the payload is now a LIST of sh-safe lines, each leaving a breadcrumb on stdout, and
          # the base64 is written in chunks with printf rather than one enormous echo argument.
          # Whatever fails next, the breadcrumbs say how far it got: BEGIN, WROTE_B64 with a byte
          # count, DECODED with a byte count, then the script's own output. Base64's alphabet has
          # no single quotes, so single-quoting each chunk is safe by construction.
          python3 - > /tmp/params.json <<'PY'
          import base64, json, textwrap
          raw = open('/tmp/ottoq_deploy.sh', 'rb').read()
          b64 = base64.b64encode(raw).decode()
          chunks = textwrap.wrap(b64, 700)
          cmds = ["echo BEGIN", "rm -f /tmp/ottoq_deploy.b64"]
          for c in chunks:
              cmds.append("printf '%s' '" + c + "' >> /tmp/ottoq_deploy.b64")
          cmds += [
              'echo "WROTE_B64 $(wc -c < /tmp/ottoq_deploy.b64) bytes"',
              "base64 -d /tmp/ottoq_deploy.b64 > /tmp/ottoq_deploy.sh",
              'echo "DECODED $(wc -c < /tmp/ottoq_deploy.sh) bytes"',
              "command -v bash || echo NO_BASH_ON_PATH",
              "bash /tmp/ottoq_deploy.sh",
          ]
          print(json.dumps({"commands": cmds}))
          PY
          echo "payload: $(python3 -c "import json;print(len(json.load(open('/tmp/params.json'))['commands']),'commands')")"

          cid="$(aws ssm send-command \
                  --instance-ids "${IID}" \
                  --document-name AWS-RunShellScript \
                  --comment "ottoq-intelligence rebuild via aws-deploy-ssm" \
                  --timeout-seconds 1200 \
                  --cloud-watch-output-config CloudWatchOutputEnabled=false \
                  --parameters file:///tmp/params.json \
                  --query 'Command.CommandId' --output text)"
          echo "command id: ${cid}"
          echo "cid=${cid}" >> "$GITHUB_OUTPUT"

          # Poll rather than `aws ssm wait`, so status is visible while it runs: a docker build
          # takes minutes and a silent wait is indistinguishable from a hang.
          st=Pending
          for i in $(seq 1 150); do
            st="$(aws ssm get-command-invocation --command-id "${cid}" --instance-id "${IID}" \
                   --query Status --output text 2>/dev/null || echo Pending)"
            case "${st}" in
              Success|Failed|Cancelled|TimedOut) echo "status: ${st}"; break ;;
              *) echo "  ... ${st} ($((i*10))s)"; sleep 10 ;;
            esac
          done
          echo "final_status=${st}" >> "$GITHUB_OUTPUT"

      - name: Print what the box said, whatever happened
        if: always()
        run: |
          set -uo pipefail
          cid="${{ steps.send.outputs.cid }}"
          [ -z "${cid}" ] && { echo "no command was sent"; exit 0; }
          echo "=== stdout ==="
          aws ssm get-command-invocation --command-id "${cid}" --instance-id "${IID}" \
            --query StandardOutputContent --output text 2>/dev/null || true
          echo
          echo "=== stderr ==="
          aws ssm get-command-invocation --command-id "${cid}" --instance-id "${IID}" \
            --query StandardErrorContent --output text 2>/dev/null || true

      - name: Fail the workflow if the box failed
        run: |
          st="${{ steps.send.outputs.final_status }}"
          if [ "${st}" != "Success" ]; then
            echo "::error::the rebuild did not succeed on the box (status: ${st})."
            echo "The stdout/stderr above is from the box itself -- read that, not this line."
            exit 1
          fi
          echo "rebuild succeeded and /health lists ${EXPECT}"
